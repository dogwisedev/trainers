<!-- Supabase → Authentication → Emails → Templates → "Magic Link"
     Subject: Your DogwiseTrainers sign-in link -->
<div style="background:#f4f5f8;padding:24px 12px;font-family:Arial,Helvetica,sans-serif">
  <div style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #E7E3F3">
    <div style="height:6px;background:#2A1971"></div>
    <div style="padding:28px 28px 24px;color:#1C1734">
      <p style="font-size:22px;font-weight:bold;margin:0 0 12px;color:#2A1971">Sign in to DogwiseTrainers</p>
      <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email" style="display:inline-block;background:#2A1971;color:#ffffff;text-decoration:none;font-weight:bold;padding:12px 22px;border-radius:10px">Sign me in</a>
      <p style="font-size:13px;line-height:1.6;color:#6B6880;margin:20px 0 0">This link works once and expires in an hour. Forgotten your password? Sign in with this link, then set a new one on your profile.</p>
    </div>
  </div>
</div>
